<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora · Assistente corporativo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23c2410c%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◐</span>
      <div>
        <h1>Aurora</h1>
        <p class="subtitle">Assistente corporativo · Financeiro · Informações internas · Ouvidoria</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="chat" role="tab" aria-selected="true">Conversa</button>
      <button class="tab" data-view="logs" role="tab" aria-selected="false">Logs</button>
    </nav>
    <div id="status" class="status" title="Estado do backend">conectando…</div>
  </header>

  <main>
    <section id="view-chat" class="view active">
      <div id="messages" class="messages" aria-live="polite">
        <div class="welcome">
          <h2>Como posso ajudar?</h2>
          <p>Faço a triagem da sua pergunta e encaminho ao agente certo. Experimente um exemplo:</p>
          <div id="examples" class="examples"></div>
        </div>
      </div>
      <form id="form" class="composer" autocomplete="off">
        <textarea id="input" rows="1" maxlength="1000" placeholder="Pergunte algo… ex.: Qual o status do protocolo OUV-0002?" required></textarea>
        <button id="send" type="submit">Enviar</button>
      </form>
    </section>

    <section id="view-logs" class="view">
      <div class="logs-head">
        <h2>Interações registradas</h2>
        <button id="refresh-logs" class="ghost">Atualizar</button>
      </div>
      <div class="table-wrap">
        <table id="logs-table">
          <thead>
            <tr><th>Horário</th><th>Pergunta</th><th>Domínio</th><th>Conf.</th><th>Método</th><th>Agente</th><th>Status</th><th>Fontes / IDs</th><th>ms</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
